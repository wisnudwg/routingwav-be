services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: routingwav
      POSTGRES_PASSWORD: routingwav
      POSTGRES_DB: routingwav
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routingwav"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web inbox

volumes:
  pgdata: